<!doctype html>
<html lang="ja">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>お祓いWebサイト</title>
		<link rel="stylesheet" href="styles.css" />
	</head>
	<body>
		<h1 class="title">お祓いWebサイト</h1>
		
		<!-- 二重叶結びのイラスト -->
		<div class="red-knot-decoration" aria-hidden="true">
			<svg viewBox="0 0 595.3 841.9" width="120" height="180" class="red-knot-svg">
				<defs>
					<style>
						.st0 {
							stroke-width: 9.9px;
							fill: none;
							stroke: #d24a34;
							stroke-linecap: round;
							stroke-linejoin: round;
							stroke-miterlimit: 10;
						}
						.st1 {
							stroke-width: 11.3px;
							fill: none;
							stroke: #d24a34;
							stroke-linecap: round;
							stroke-linejoin: round;
							stroke-miterlimit: 10;
						}
					</style>
				</defs>
				<path class="st0" d="M339.9,186.1c0,34.9-19.4,78-43.2,78s-43.2-43.1-43.2-78,19.4-53.9,43.2-53.9,43.2,19.1,43.2,53.9Z"/>
				<path class="st0" d="M380.3,297.5c-33.1,10.9-75.7-1.4-82.7-22.3s24.5-42.7,57.6-53.6,54.2.4,61.1,21.3c6.9,21-3,43.7-36.1,54.6Z"/>
				<path class="st0" d="M219.7,305c-34.7-3.4-56.4-23.2-54.2-45.8,2.2-22.6,27.4-39.3,62.2-35.9,34.7,3.4,67.5,25.1,65.3,47.7-2.2,22.6-38.6,37.4-73.3,34Z"/>
				<path class="st0" d="M277.6,262.4s.7-8.5,5.8-14.3,6.1-5.1,11.2-5.2"/>
				<path class="st0" d="M318.9,256.2s-16.7,3.2-21.8-15.4"/>
				<path class="st1" d="M279.5,262.2s-.8,11.9,18.6,16.1"/>
				<path class="st1" d="M316.1,261s-15.7,11.5-19.1,21.1"/>
				<path class="st1" d="M284.9,289.3c-6.3,0-42.5,43.7-55.8,113.9"/>
				<path class="st1" d="M308,289.3s40.1,68.8,48,106.6"/>
			</svg>
		</div>

		<!-- 背景の幽霊（浄化が進むと薄れる） -->
		<div id="ghost" aria-hidden="true">
			<svg viewBox="0 0 200 300" width="100%" height="auto">
				<defs>
					<linearGradient id="ghostBody" x1="0" y1="0" x2="0" y2="1">
						<stop offset="0" stop-color="#fbfdfe" />
						<stop offset="1" stop-color="#dfe8ed" />
					</linearGradient>
				</defs>
				<!-- 体（より丸く少し大きめ） -->
				<path d="M100 24
					C58 24 44 56 44 98
					C44 144 39 193 37 240
					C36 256 45 267 56 263
					C65 260 71 263 78 272
					C86 282 94 281 100 271
					C106 281 114 282 122 272
					C129 263 135 260 144 263
					C155 267 164 256 163 240
					C161 193 156 144 156 98
					C156 56 142 24 100 24 Z"
					fill="url(#ghostBody)" stroke="#2b2b2b" stroke-width="2" stroke-opacity="0.6" />
				<!-- 目 -->
				<ellipse cx="80" cy="118" rx="12" ry="16" fill="#404040" />
				<ellipse cx="120" cy="118" rx="12" ry="16" fill="#404040" />
			</svg>
		</div>

		<!-- 検知用（画面には出さない） -->
		<video id="video" playsinline muted></video>
		<canvas id="proc" style="display: none"></canvas>
		<audio id="bgm" src="五七の調べ.mp3" loop preload="auto" hidden></audio>

		<!-- three.js の3D御幣＋手のボーン -->
		<canvas id="scene"></canvas>

		<div id="progress" aria-hidden="true">
			<span class="progress-label">浄化中…</span>
			<div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
		</div>

		<div id="complete">
			<span class="complete-main">お祓い完了</span>
			<span class="complete-sub">このサイトの霊は浄化されました</span>
		</div>

		<p class="caption" id="caption">読み込み中…</p>
		<p class="note">
			映像はこの端末の中だけで処理されます。カメラの使用を許可してください。
		</p>

		<script type="module">
			import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

			const video = document.getElementById('video');
			const bgm = document.getElementById('bgm');
			const caption = document.getElementById('caption');
			const startBgm = async () => {
				try {
					bgm.currentTime = 0;
					await bgm.play();
					return true;
				} catch (error) {
					console.warn('BGM playback failed', error);
					return false;
				}
			};
			const unlockBgm = async () => {
				if (await startBgm()) {
					window.removeEventListener('pointerdown', unlockBgm);
					window.removeEventListener('keydown', unlockBgm);
					window.removeEventListener('touchstart', unlockBgm);
				}
			};
			window.addEventListener('pointerdown', unlockBgm, { once: true });
			window.addEventListener('keydown', unlockBgm, { once: true });
			window.addEventListener('touchstart', unlockBgm, { once: true });
			const progressFill = document.getElementById('progress-fill');
			const completeEl = document.getElementById('complete');
			const ghostEl = document.getElementById('ghost');
			const GUIDE_TEXT = '手を大きく振ってください';
			const setCaption = (text) => { caption.textContent = text; };
			let lastPurifyEffectTime = 0;
			const PURIFY_EFFECT_COOLDOWN = 0.6;

			const NUM_HANDS = 1;
			const HAND_CONNECTIONS = [
				[0, 1], [1, 2], [2, 3], [3, 4],
				[0, 5], [5, 6], [6, 7], [7, 8],
				[5, 9], [9, 10], [10, 11], [11, 12],
				[9, 13], [13, 14], [14, 15], [15, 16],
				[13, 17], [17, 18], [18, 19], [19, 20],
				[0, 17],
			];

			const rand = (n) => {
				const x = Math.sin(n * 127.1) * 43758.5453;
				return x - Math.floor(x);
			};

			// ====== three.js セットアップ ======
			const sceneCanvas = document.getElementById('scene');
			const renderer = new THREE.WebGLRenderer({ canvas: sceneCanvas, antialias: true, alpha: true });
			renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

			const scene = new THREE.Scene();
			const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
			camera.position.set(0, 0, 6);

			scene.add(new THREE.AmbientLight(0xfff4e0, 0.9));
			const keyLight = new THREE.DirectionalLight(0xffffff, 1.0);
			keyLight.position.set(3, 4, 5);
			scene.add(keyLight);
			const fillLight = new THREE.DirectionalLight(0xdfeaff, 0.5);
			fillLight.position.set(-4, 1, 3);
			scene.add(fillLight);

			// ====== 大幣（おおぬさ） ======
			const wand = new THREE.Group();

			// 木の棒（明るい木色・丸い先端）
			const woodMat = new THREE.MeshStandardMaterial({ color: 0xd9b98a, roughness: 0.6, metalness: 0.04 });
			const stick = new THREE.Mesh(new THREE.CylinderGeometry(0.062, 0.07, 2.9, 24), woodMat);
			stick.position.y = -0.65;
			wand.add(stick);
			const tip = new THREE.Mesh(new THREE.SphereGeometry(0.07, 20, 16), woodMat);
			tip.position.y = -2.1;
			wand.add(tip);
			// 紙を束ねる部分
			const collar = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.14, 20), new THREE.MeshStandardMaterial({ color: 0xcaa877, roughness: 0.6 }));
			collar.position.y = 0.72;
			wand.add(collar);

			// 白い紙の房（多数のリボンをフレーム毎に変形）
			const paperMat = new THREE.MeshStandardMaterial({ color: 0xfbfaf5, roughness: 0.95, metalness: 0.0, side: THREE.DoubleSide });
			const PAPER = { count: 18, seg: 18, baseLen: 1.55, width: 0.17, fold: 0.06, anchorY: 0.74 };
			const paperGroup = new THREE.Group();
			wand.add(paperGroup);
			const strips = [];
			for (let s = 0; s < PAPER.count; s++) {
				const rows = PAPER.seg + 1;
				const positions = new Float32Array(rows * 2 * 3);
				const geo = new THREE.BufferGeometry();
				geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
				const idx = [];
				for (let i = 0; i < PAPER.seg; i++) {
					const a = i * 2, b = i * 2 + 1, c = (i + 1) * 2, d = (i + 1) * 2 + 1;
					idx.push(a, b, d, a, d, c);
				}
				geo.setIndex(idx);
				const mesh = new THREE.Mesh(geo, paperMat);
				paperGroup.add(mesh);

				const frac = PAPER.count > 1 ? s / (PAPER.count - 1) : 0.5;
				strips.push({
					geo, positions,
					fanX: (frac - 0.5) * 1.15,          // 横への広がり
					fanZ: (rand(s) - 0.5) * 0.7,        // 奥行きの広がり
					length: PAPER.baseLen * (0.82 + rand(s + 10) * 0.38),
					phase: rand(s + 20) * Math.PI * 2,
					swayGain: 0.7 + rand(s + 30) * 0.6,
				});
			}

			wand.visible = false;
			scene.add(wand);

			// ====== 塩のパーティクル（振ると降る） ======
			const MAX_SALT = 9000;
			const saltPos = new Float32Array(MAX_SALT * 3);
			const saltVel = new Float32Array(MAX_SALT * 3);
			const saltLife = new Float32Array(MAX_SALT); // 残り寿命 0..1
			const saltSizeAttr = new Float32Array(MAX_SALT);
			const saltGeo = new THREE.BufferGeometry();
			saltGeo.setAttribute('position', new THREE.BufferAttribute(saltPos, 3));
			saltGeo.setAttribute('aLife', new THREE.BufferAttribute(saltLife, 1));
			saltGeo.setAttribute('aSize', new THREE.BufferAttribute(saltSizeAttr, 1));
			const saltMat = new THREE.ShaderMaterial({
				transparent: true,
				depthWrite: false,
				uniforms: { uScale: { value: 400 } },
				vertexShader: `
					attribute float aLife;
					attribute float aSize;
					varying float vAlpha;
					uniform float uScale;
					void main() {
						vec4 mv = modelViewMatrix * vec4(position, 1.0);
						vAlpha = smoothstep(0.0, 0.25, aLife);
						gl_PointSize = aSize * (uScale / -mv.z);
						gl_Position = projectionMatrix * mv;
						if (aLife <= 0.0) gl_Position = vec4(2.0, 2.0, 2.0, 1.0); // 死んだ粒は画面外へ
					}
				`,
				fragmentShader: `
					varying float vAlpha;
					void main() {
						vec2 c = gl_PointCoord - vec2(0.5);
						float d = length(c);
						if (d > 0.5) discard;
						// 塩粒らしい硬いエッジ（中心はしっかり不透明、縁だけ軽く落とす）
						float grain = 1.0 - smoothstep(0.36, 0.5, d);
						gl_FragColor = vec4(1.0, 1.0, 1.0, vAlpha * grain);
					}
				`,
			});
			const saltPoints = new THREE.Points(saltGeo, saltMat);
			saltPoints.frustumCulled = false;
			scene.add(saltPoints);

			// ====== 下に積もる塩（ハイトマップ） ======
			const PILE_BINS = 100;
			let PILE_MAX = 6;             // 積もりの高さ上限（resizeで画面の高さに合わせる）
			const PILE_GRAIN = 0.005;      // 1粒あたりの積もり量（少しずつ・ゆっくり）
			const pileHeight = new Float32Array(PILE_BINS);
			const pilePositions = new Float32Array(PILE_BINS * 2 * 3);
			const pileGeo = new THREE.BufferGeometry();
			pileGeo.setAttribute('position', new THREE.BufferAttribute(pilePositions, 3));
			const pileIdx = [];
			for (let i = 0; i < PILE_BINS - 1; i++) {
				const t = i * 2, bo = i * 2 + 1, tn = (i + 1) * 2, bn = (i + 1) * 2 + 1;
				pileIdx.push(t, bo, bn, t, bn, tn);
			}
			pileGeo.setIndex(pileIdx);
			const pileMat = new THREE.MeshStandardMaterial({ color: 0xf1ece1, roughness: 1, metalness: 0 });
			const pileMesh = new THREE.Mesh(pileGeo, pileMat);
			pileMesh.position.z = -0.05;
			pileMesh.frustumCulled = false;
			scene.add(pileMesh);

			const PILE_MAX_STEP = 0.22;    // 隣の山との高低差の上限＝盛り塩の斜面（大きいほど急な三角）
			const pileBinForX = (x) => {
				const b = Math.floor(((x + visW / 2) / visW) * PILE_BINS);
				return Math.max(0, Math.min(PILE_BINS - 1, b));
			};
			// 安息角を保つように崩す＝三角（盛り塩）状に積もらせる
			const relaxPile = () => {
				for (let iter = 0; iter < 3; iter++) {
					for (let i = 0; i < PILE_BINS - 1; i++) {
						const diff = pileHeight[i] - pileHeight[i + 1];
						if (diff > PILE_MAX_STEP) {
							const m = (diff - PILE_MAX_STEP) * 0.5;
							pileHeight[i] -= m; pileHeight[i + 1] += m;
						} else if (diff < -PILE_MAX_STEP) {
							const m = (-diff - PILE_MAX_STEP) * 0.5;
							pileHeight[i] += m; pileHeight[i + 1] -= m;
						}
					}
				}
			};
			const rebuildPile = () => {
				const floorY = -visH / 2;
				const halfW = visW / 2;
				for (let i = 0; i < PILE_BINS; i++) {
					const x = -halfW + ((i + 0.5) / PILE_BINS) * visW;
					const t = i * 2 * 3, bo = t + 3;
					pilePositions[t] = x; pilePositions[t + 1] = floorY + pileHeight[i]; pilePositions[t + 2] = 0;
					pilePositions[bo] = x; pilePositions[bo + 1] = floorY - 0.4; pilePositions[bo + 2] = 0;
				}
				pileGeo.attributes.position.needsUpdate = true;
				pileGeo.computeVertexNormals();
			};

			let saltCursor = 0;
			const emitSalt = (n, origin, baseVel, scaleAmt) => {
				for (let k = 0; k < n; k++) {
					let idx = -1;
					for (let s = 0; s < MAX_SALT; s++) {
						const j = (saltCursor + s) % MAX_SALT;
						if (saltLife[j] <= 0) { idx = j; saltCursor = (j + 1) % MAX_SALT; break; }
					}
					if (idx < 0) return; // 使い切り
					const b = idx * 3;
					const spread = 0.22 * scaleAmt;
					saltPos[b] = origin.x + (Math.random() - 0.5) * spread;
					saltPos[b + 1] = origin.y + (Math.random() - 0.5) * spread;
					saltPos[b + 2] = origin.z + (Math.random() - 0.5) * spread;
					saltVel[b] = baseVel.x * (0.4 + Math.random() * 0.8) + (Math.random() - 0.5) * 0.7;
					saltVel[b + 1] = baseVel.y * (0.2 + Math.random() * 0.4) + Math.random() * 0.3;
					saltVel[b + 2] = baseVel.z * (0.4 + Math.random() * 0.8) + (Math.random() - 0.5) * 0.7;
					saltLife[idx] = 1.0;
					saltSizeAttr[idx] = (0.03 + Math.random() * 0.035) * Math.max(scaleAmt, 0.4);
				}
			};

			// 画面の上から塩を降らせる（リングバッファ方式：必ず放出される）
			const emitSaltRain = (n) => {
				for (let k = 0; k < n; k++) {
					const idx = saltCursor;
					saltCursor = (saltCursor + 1) % MAX_SALT;
					const b = idx * 3;
					// 画面上部から、御幣（棒）のX位置あたりに細い縦帯で降らせる
					saltPos[b] = wp.x + (Math.random() - 0.5) * SALT_SPAWN_WIDTH;
					saltPos[b + 1] = visH / 2 + 0.8 - Math.random() * SALT_SPAWN_HEIGHT;
					saltPos[b + 2] = (Math.random() - 0.5) * 1.0;
					saltVel[b] = (Math.random() - 0.5) * 0.15;        // 横流れは控えめ（雪っぽさを消す）
					saltVel[b + 1] = -1.2 - Math.random() * 0.9;      // まっすぐ速めに落ちる
					saltVel[b + 2] = (Math.random() - 0.5) * 0.15;
					saltLife[idx] = 1.0;
					saltSizeAttr[idx] = 0.1 + Math.random() * 0.07;
				}
			};

			const SALT_GRAVITY = 6.5;
			const SALT_LIFE_SEC = 2.0;
			const updateSalt = (dt) => {
				const dl = dt / SALT_LIFE_SEC;
				const floorY = -visH / 2;
				for (let i = 0; i < MAX_SALT; i++) {
					if (saltLife[i] <= 0) continue;
					saltLife[i] -= dl;
					if (saltLife[i] < 0) saltLife[i] = 0;
					const b = i * 3;
					saltVel[b + 1] -= SALT_GRAVITY * dt;
					saltPos[b] += saltVel[b] * dt;
					saltPos[b + 1] += saltVel[b + 1] * dt;
					saltPos[b + 2] += saltVel[b + 2] * dt;

					// 積もりの表面（または床）に達したら、その1点に積もらせて消す（山は relaxPile で三角に整う）
					const bin = pileBinForX(saltPos[b]);
					const surfaceY = floorY + pileHeight[bin];
					if (saltPos[b + 1] <= surfaceY) {
						pileHeight[bin] = Math.min(PILE_MAX, pileHeight[bin] + PILE_GRAIN);
						saltLife[i] = 0;
					}
				}
				saltGeo.attributes.position.needsUpdate = true;
				saltGeo.attributes.aLife.needsUpdate = true;
				saltGeo.attributes.aSize.needsUpdate = true;
				relaxPile();   // 盛り塩のように三角へ整える
				rebuildPile();
			};

			// ---- 手のボーン（藍色・任意表示） ----
			const jointMat = new THREE.MeshStandardMaterial({ color: 0x33576a, roughness: 0.5, metalness: 0.1 });
			const boneMat = new THREE.MeshStandardMaterial({ color: 0x2d4a5a, roughness: 0.6, metalness: 0.1 });
			const hand = new THREE.Group();
			hand.visible = false;
			scene.add(hand);
			const jointGeo = new THREE.SphereGeometry(0.05, 16, 16);
			const joints = [];
			for (let i = 0; i < 21; i++) {
				const j = new THREE.Mesh(jointGeo, jointMat);
				hand.add(j);
				joints.push(j);
			}
			const boneGeo = new THREE.CylinderGeometry(0.025, 0.025, 1, 12);
			const bones = [];
			for (let i = 0; i < HAND_CONNECTIONS.length; i++) {
				const b = new THREE.Mesh(boneGeo, boneMat);
				hand.add(b);
				bones.push(b);
			}
			const upAxis = new THREE.Vector3(0, 1, 0);
			const orientBone = (mesh, a, b) => {
				const dir = new THREE.Vector3().subVectors(b, a);
				const len = dir.length();
				mesh.position.copy(a).add(b).multiplyScalar(0.5);
				mesh.scale.set(1, Math.max(len, 0.0001), 1);
				if (len > 0.0001) mesh.quaternion.setFromUnitVectors(upAxis, dir.clone().normalize());
			};

			// ---- 座標変換・リサイズ ----
			let visW = 1, visH = 1;
			const resize = () => {
				const w = window.innerWidth, h = window.innerHeight;
				renderer.setSize(w, h, false);
				camera.aspect = w / h;
				camera.updateProjectionMatrix();
				const vFOV = THREE.MathUtils.degToRad(camera.fov);
				visH = 2 * Math.tan(vFOV / 2) * camera.position.z;
				visW = visH * camera.aspect;
				saltMat.uniforms.uScale.value = h * 0.5 * (renderer.getPixelRatio());
				PILE_MAX = visH; // 画面上部まで積もれるように
			};
			window.addEventListener('resize', resize);
			resize();

			const toWorld = (px, py) => ({
				wx: ((px / 100) * 2 - 1) * (visW / 2),
				wy: -((py / 100) * 2 - 1) * (visH / 2),
			});
			const Z_SCALE = 4;
			const landmarkToWorld = (lm, out) => {
				out.set(((1 - lm.x) * 2 - 1) * (visW / 2), -(lm.y * 2 - 1) * (visH / 2), -lm.z * Z_SCALE);
				return out;
			};

			// ====== 白い紙のゆらぎ更新（動きに合わせて遅れて揺れる） ======
			const swayLocal = new THREE.Vector3();
			const prevPos = new THREE.Vector3();
			let prevInit = false;
			const wp = new THREE.Vector3();
			const wq = new THREE.Quaternion();
			const lastWandDelta = new THREE.Vector3(); // 御幣の1フレームのワールド移動量（塩の放出に使う）
			const updatePaper = () => {
				wand.updateMatrixWorld();
				wand.getWorldPosition(wp);
				if (!prevInit) { prevPos.copy(wp); prevInit = true; }
				const dWorld = wp.clone().sub(prevPos);
				prevPos.copy(wp);
				lastWandDelta.copy(dWorld);
				// 移動量を御幣ローカル方向へ変換し、逆向きに靡かせる
				wand.getWorldQuaternion(wq).invert();
				const dLocal = dWorld.applyQuaternion(wq);
				const targetX = THREE.MathUtils.clamp(-dLocal.x * 7, -0.6, 0.6);
				const targetY = THREE.MathUtils.clamp(-dLocal.y * 7, -0.6, 0.6);
				swayLocal.x += (targetX - swayLocal.x) * 0.12;
				swayLocal.y += (targetY - swayLocal.y) * 0.12;

				for (const st of strips) {
					const pos = st.positions;
					for (let i = 0; i <= PAPER.seg; i++) {
						const t = i / PAPER.seg;
						const down = t * st.length;
						let cx = st.fanX * down * 0.5;
						let cy = PAPER.anchorY - down;
						let cz = st.fanZ * down * 0.45;
						// アコーディオンの折り（奥行き方向・静的）
						cz += ((i % 2) * 2 - 1) * PAPER.fold * (1 - 0.2 * t);
						// 揺れは「動いた分だけ」：先端ほど大きく（止まれば静止）
						const swayF = t * t;
						cx += swayLocal.x * swayF * st.swayGain;
						cy += swayLocal.y * swayF * st.swayGain * 0.5;
						const hw = PAPER.width * 0.5 * (1 - 0.25 * t);
						const li = i * 2 * 3, ri = li + 3;
						pos[li] = cx - hw; pos[li + 1] = cy; pos[li + 2] = cz;
						pos[ri] = cx + hw; pos[ri + 1] = cy; pos[ri + 2] = cz;
					}
					st.geo.attributes.position.needsUpdate = true;
					st.geo.computeVertexNormals();
					st.geo.computeBoundingSphere();
				}
			};

			// ====== フレーム差分による動き検知（モデル不要） ======
			const proc = document.getElementById('proc');
			const pctx = proc.getContext('2d', { willReadFrequently: true });
			const PW = 96, PH = 96;
			proc.width = PW; proc.height = PH;
			const DIFF_THRESHOLD = 22;
			const MIN_MOVED_PIXELS = PW * PH * 0.004;
			let previousGray = null;
			let targetX = 50, targetY = 50;
			const detectMotion = () => {
				if (video.readyState < 2 || video.videoWidth === 0) return false;
				pctx.drawImage(video, 0, 0, PW, PH);
				const frame = pctx.getImageData(0, 0, PW, PH).data;
				if (!previousGray) {
					previousGray = new Float32Array(PW * PH);
					for (let i = 0, p = 0; i < frame.length; i += 4, p++) {
						previousGray[p] = 0.299 * frame[i] + 0.587 * frame[i + 1] + 0.114 * frame[i + 2];
					}
					return false;
				}
				let sumX = 0, sumY = 0, count = 0;
				for (let y = 0; y < PH; y++) {
					for (let x = 0; x < PW; x++) {
						const p = y * PW + x, i = p * 4;
						const gray = 0.299 * frame[i] + 0.587 * frame[i + 1] + 0.114 * frame[i + 2];
						const diff = Math.abs(gray - previousGray[p]);
						previousGray[p] = gray;
						if (diff > DIFF_THRESHOLD) { sumX += x; sumY += y; count++; }
					}
				}
				if (count < MIN_MOVED_PIXELS) return false;
				targetX = (1 - (sumX / count) / PW) * 100;
				targetY = ((sumY / count) / PH) * 100;
				return true;
			};

			let curX = 0, curY = 0;
			const updateWandByMotion = () => {
				const { wx, wy } = toWorld(targetX, targetY);
				const vx = wx - curX;
				curX += vx * 0.18;
				curY += (wy - curY) * 0.18;
				wand.position.set(curX, curY, 0);
				wand.scale.setScalar(0.62);
				// 動いた分だけ傾け、止まれば直立へ戻す（自動アニメはしない）
				wand.rotation.z += (THREE.MathUtils.clamp(-vx * 0.7, -0.6, 0.6) - wand.rotation.z) * 0.15;
				wand.rotation.y += (0 - wand.rotation.y) * 0.1;
				wand.rotation.x += (0 - wand.rotation.x) * 0.1;
			};

			// ---- 手のランドマークで御幣を握らせる ----
			const smooth = [];
			for (let i = 0; i < 21; i++) smooth.push(new THREE.Vector3());
			let hasSmooth = false;
			const tmp = new THREE.Vector3();
			const updateHandAndWand = (landmarks) => {
				for (let i = 0; i < 21; i++) {
					landmarkToWorld(landmarks[i], tmp);
					if (hasSmooth) smooth[i].lerp(tmp, 0.5); else smooth[i].copy(tmp);
				}
				hasSmooth = true;
				for (let i = 0; i < 21; i++) joints[i].position.copy(smooth[i]);
				for (let i = 0; i < HAND_CONNECTIONS.length; i++) {
					const [a, b] = HAND_CONNECTIONS[i];
					orientBone(bones[i], smooth[a], smooth[b]);
				}
				const wrist = smooth[0], midMcp = smooth[9];
				wand.position.copy(tmp.copy(wrist).lerp(midMcp, 0.6));
				const handSize = wrist.distanceTo(midMcp);
				wand.scale.setScalar(THREE.MathUtils.clamp(handSize * 3.4, 0.45, 1.6));

				// 手がカメラに近い（手が大きい）ほど closeness が 1 に近づく
				const CLOSE_MIN = 0.18, CLOSE_MAX = 0.42;
				const closeness = THREE.MathUtils.clamp((handSize - CLOSE_MIN) / (CLOSE_MAX - CLOSE_MIN), 0, 1);

				// 手の向きに沿わせる（倒れるほど傾きは弱める）
				const angle = Math.atan2(midMcp.y - wrist.y, midMcp.x - wrist.x);
				wand.rotation.z = (angle - Math.PI / 2) * (1 - closeness * 0.85);
				// 近づくほど縦に倒して底面をこちら（カメラ）へ向ける
				wand.rotation.x = -closeness * (Math.PI * 0.5);
				wand.rotation.y = 0;
			};

			// ====== メインループ ======
			let running = false;
			let stream = null;
			let handLandmarker = null;
			let modelFailed = false;

			// 塩の放出制御
			let saltLastT = performance.now() / 1000;
			let saltAccum = 0;
			const SALT_BASE_RATE = 1.2;    // 常に降る塩（粒/秒・ごく控えめ）
			const SALT_DOWN_THRESH = 1.4;  // これ以上の「下向き」速度で振り下ろしと判定
			const SALT_EMIT_K = 3;         // 下向き速度に対する追加放出量
			const SALT_SPAWN_WIDTH = 0.9;  // 中央に落とす細い横幅（盛り塩を中央に集める）
			const SALT_SPAWN_HEIGHT = 1.6; // 上部で縦に少し伸ばす範囲（ワールド単位）

			// お祓いの進行度
			let purify = 0;
			let purifyComplete = false;
			let purifyHold = 0;
			const PURIFY_GAIN = 0.12;          // 振り下ろしで進む速さ（より早く貯まる）
			const PURIFY_DECAY = 0.03;         // 振らないと少しずつ戻る
			const PURIFY_COMPLETE_HOLD = 4.5;  // 完了表示の時間（秒）→ 経過後リセット

			const loop = () => {
				try {
					if (!running) return;
					if (video.readyState < 2 || video.videoWidth === 0) {
						setCaption('カメラ映像を待っています');
						return;
					}
					let handActive = false;
					if (handLandmarker) {
						let results;
						try { results = handLandmarker.detectForVideo(video, performance.now()); }
						catch (e) { console.error('detectForVideo failed', e); }
						const landmarks = results?.landmarks?.[0];
						if (landmarks) { updateHandAndWand(landmarks); handActive = true; }
					}
					if (handActive) {
						hand.visible = true;
					} else {
						hand.visible = false;
						hasSmooth = false;
						const moved = detectMotion();
						updateWandByMotion();
					}
					if (caption.textContent !== GUIDE_TEXT) {
						setCaption(GUIDE_TEXT);
					}
					wand.visible = true;
				} finally {
					updatePaper(); // 白い紙のゆらぎ

					// 塩：振りが速いほど、画面の上から降り注ぐ
					const now = performance.now() / 1000;
					const dt = Math.min(0.05, now - saltLastT);
					saltLastT = now;
					// 下向きの速度（振り下ろし）だけを見る
					const downSpeed = Math.max(0, -lastWandDelta.y) / Math.max(dt, 0.001);
					saltAccum += SALT_BASE_RATE * dt; // 常に静かに降る（控えめ）
					if (wand.visible && downSpeed > SALT_DOWN_THRESH) {
						saltAccum += Math.min(70, (downSpeed - SALT_DOWN_THRESH) * SALT_EMIT_K); // 振り下ろすと増える
					}
					const emitN = Math.floor(saltAccum);
					if (emitN > 0) { emitSaltRain(emitN); saltAccum -= emitN; }
					updateSalt(dt);

					// お祓いの進行度：振り下ろし続けると溜まり、満タンで「完了！」
					if (!purifyComplete) {
						if (wand.visible && downSpeed > SALT_DOWN_THRESH) {
							purify += Math.min(12, downSpeed - SALT_DOWN_THRESH) * PURIFY_GAIN * dt;						
						// 浄化エフェクト：振り下ろし時に幽霊に浄化的な光が出る
						if (now - lastPurifyEffectTime > PURIFY_EFFECT_COOLDOWN) {
							ghostEl.classList.remove('purifying');
							void ghostEl.offsetWidth; // リフロー強制
							ghostEl.classList.add('purifying');
							lastPurifyEffectTime = now;
						}						} else {
							purify -= PURIFY_DECAY * dt;
						}
						purify = Math.max(0, Math.min(1, purify));
						progressFill.style.width = (purify * 100) + '%';
						// 浄化が進むほど幽霊が薄れる
						ghostEl.style.opacity = (0.85 * (1 - purify)).toFixed(3);
						if (purify >= 1) {
							purifyComplete = true;
							purifyHold = 0;
							completeEl.classList.add('show');
							emitSaltRain(260); // 完了の祝いの塩
						}
					} else {
						purifyHold += dt;
						if (purifyHold > PURIFY_COMPLETE_HOLD) {
							purifyComplete = false;
							purify = 0;
							progressFill.style.width = '0%';
							completeEl.classList.remove('show');
						}
					}

					renderer.render(scene, camera);
					requestAnimationFrame(loop);
				}
			};

			// ====== MediaPipe 読み込み（任意・複数CDN） ======
			const CDN_BASES = [
				'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22',
				'https://unpkg.com/@mediapipe/tasks-vision@0.10.22',
			];
			const loadVision = async () => {
				for (const base of CDN_BASES) {
					try {
						const mod = await import(`${base}/vision_bundle.mjs`);
						const fileset = await mod.FilesetResolver.forVisionTasks(`${base}/wasm`);
						console.log('Vision loaded from', base);
						return { HandLandmarker: mod.HandLandmarker, fileset };
					} catch (e) {
						console.warn(`Vision load failed from ${base}`, e);
					}
				}
				return null;
			};
			const initHandTracking = async () => {
				const vision = await loadVision();
				if (!vision) { modelFailed = true; return; }
				const { HandLandmarker, fileset } = vision;
				const makeLandmarker = (delegate) =>
					HandLandmarker.createFromOptions(fileset, {
						baseOptions: {
							modelAssetPath:
								'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
							delegate,
						},
						runningMode: 'VIDEO', numHands: NUM_HANDS,
						minHandDetectionConfidence: 0.5, minHandPresenceConfidence: 0.5, minTrackingConfidence: 0.5,
					});
				try { handLandmarker = await makeLandmarker('GPU'); }
				catch (gpuError) {
					console.warn('GPU delegate failed, falling back to CPU.', gpuError);
					try { handLandmarker = await makeLandmarker('CPU'); }
					catch (cpuError) { modelFailed = true; console.error('HandLandmarker 生成失敗。', cpuError); }
				}
			};

			// ====== 起動 ======
			const start = async () => {
				setCaption('カメラを準備しています');
				stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
				video.srcObject = stream;
				await video.play();
				bgm.loop = true;
				bgm.volume = 0.6;
				await startBgm();
				running = true;
				previousGray = null;
				wand.visible = true;
				setCaption('手を大きく振ってください');
				requestAnimationFrame(loop);
				initHandTracking();
			};
			start().catch((error) => {
				console.error(error);
				if (error && (error.name === 'NotAllowedError' || error.name === 'NotFoundError')) {
					setCaption('カメラの許可を確認してください');
				} else {
					setCaption('起動に失敗しました（コンソールを確認）');
				}
			});
		</script>
	</body>
</html>
