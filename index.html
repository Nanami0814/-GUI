<!doctype html>
<html lang="ja">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>お祓いWebサイト</title>
		<link rel="stylesheet" href="styles.css" />
	</head>
	<body>
		<h1 class="title">お祓いWebサイト</h1>

		<!-- 検知用（画面には出さない） -->
		<video id="video" playsinline muted></video>
		<canvas id="proc" style="display: none"></canvas>

		<!-- three.js の3D御幣＋手のボーン -->
		<canvas id="scene"></canvas>

		<p class="caption" id="caption">読み込み中…</p>
		<p class="note">映像は端末内でのみ処理されます。ブラウザのカメラ許可が必要です。</p>

		<script type="module">
			import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

			const video = document.getElementById('video');
			const caption = document.getElementById('caption');
			const setCaption = (text) => { caption.textContent = text; };

			const NUM_HANDS = 1;

			const HAND_CONNECTIONS = [
				[0, 1], [1, 2], [2, 3], [3, 4],
				[0, 5], [5, 6], [6, 7], [7, 8],
				[5, 9], [9, 10], [10, 11], [11, 12],
				[9, 13], [13, 14], [14, 15], [15, 16],
				[13, 17], [17, 18], [18, 19], [19, 20],
				[0, 17],
			];

			// ====== three.js セットアップ ======
			const sceneCanvas = document.getElementById('scene');
			const renderer = new THREE.WebGLRenderer({ canvas: sceneCanvas, antialias: true, alpha: true });
			renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

			const scene = new THREE.Scene();
			const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
			camera.position.set(0, 0, 6);

			scene.add(new THREE.AmbientLight(0xfff4e0, 0.85));
			const keyLight = new THREE.DirectionalLight(0xffffff, 1.0);
			keyLight.position.set(3, 4, 5);
			scene.add(keyLight);
			const fillLight = new THREE.DirectionalLight(0xffe2b8, 0.45);
			fillLight.position.set(-4, 1, 2);
			scene.add(fillLight);

			// ---- 御幣（ごへい） ----
			const wand = new THREE.Group();
			const stickMat = new THREE.MeshStandardMaterial({ color: 0x6f4a2a, roughness: 0.65, metalness: 0.05 });
			const stick = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.085, 2.6, 24), stickMat);
			stick.position.y = -0.6;
			wand.add(stick);
			const bindMat = new THREE.MeshStandardMaterial({ color: 0xc8442f, roughness: 0.5, metalness: 0.05 });
			const bind = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.17, 0.32, 24), bindMat);
			bind.position.y = 0.6;
			wand.add(bind);
			const paperMat = new THREE.MeshStandardMaterial({ color: 0xfdfcf7, roughness: 0.95, metalness: 0.0, side: THREE.DoubleSide });
			const makeShide = (sign) => {
				const s = sign;
				const shape = new THREE.Shape();
				shape.moveTo(0, 1.5);
				shape.lineTo(s * 0.95, 1.5);
				shape.lineTo(s * 0.45, 1.05);
				shape.lineTo(s * 1.05, 1.05);
				shape.lineTo(s * 0.5, 0.55);
				shape.lineTo(s * 1.1, 0.55);
				shape.lineTo(s * 0.5, 0.0);
				shape.lineTo(0, 0.0);
				shape.closePath();
				const geo = new THREE.ExtrudeGeometry(shape, { depth: 0.06, bevelEnabled: false });
				geo.translate(0, 0, -0.03);
				const mesh = new THREE.Mesh(geo, paperMat);
				mesh.position.y = 0.55;
				return mesh;
			};
			wand.add(makeShide(1));
			wand.add(makeShide(-1));
			wand.visible = false;
			scene.add(wand);

			// ---- 手のボーン（藍色の骨格・任意表示） ----
			const jointMat = new THREE.MeshStandardMaterial({ color: 0x33576a, roughness: 0.5, metalness: 0.1 });
			const boneMat = new THREE.MeshStandardMaterial({ color: 0x2d4a5a, roughness: 0.6, metalness: 0.1 });
			const hand = new THREE.Group();
			hand.visible = false;
			scene.add(hand);
			const jointGeo = new THREE.SphereGeometry(0.05, 16, 16);
			const joints = [];
			for (let i = 0; i < 21; i++) {
				const j = new THREE.Mesh(jointGeo, jointMat);
				hand.add(j);
				joints.push(j);
			}
			const boneGeo = new THREE.CylinderGeometry(0.025, 0.025, 1, 12);
			const bones = [];
			for (let i = 0; i < HAND_CONNECTIONS.length; i++) {
				const b = new THREE.Mesh(boneGeo, boneMat);
				hand.add(b);
				bones.push(b);
			}
			const upAxis = new THREE.Vector3(0, 1, 0);
			const orientBone = (mesh, a, b) => {
				const dir = new THREE.Vector3().subVectors(b, a);
				const len = dir.length();
				mesh.position.copy(a).add(b).multiplyScalar(0.5);
				mesh.scale.set(1, Math.max(len, 0.0001), 1);
				if (len > 0.0001) mesh.quaternion.setFromUnitVectors(upAxis, dir.clone().normalize());
			};

			// ---- 座標変換・リサイズ ----
			let visW = 1;
			let visH = 1;
			const resize = () => {
				const w = window.innerWidth, h = window.innerHeight;
				renderer.setSize(w, h, false);
				camera.aspect = w / h;
				camera.updateProjectionMatrix();
				const vFOV = THREE.MathUtils.degToRad(camera.fov);
				visH = 2 * Math.tan(vFOV / 2) * camera.position.z;
				visW = visH * camera.aspect;
			};
			window.addEventListener('resize', resize);
			resize();

			// 画面の % → ワールド座標
			const toWorld = (px, py) => ({
				wx: ((px / 100) * 2 - 1) * (visW / 2),
				wy: -((py / 100) * 2 - 1) * (visH / 2),
			});

			const Z_SCALE = 4;
			const landmarkToWorld = (lm, out) => {
				const nx = (1 - lm.x) * 2 - 1; // 鏡像反転
				const ny = lm.y * 2 - 1;
				out.set(nx * (visW / 2), -ny * (visH / 2), -lm.z * Z_SCALE);
				return out;
			};

			// ====== フレーム差分による動き検知（モデル不要・常に動く） ======
			const proc = document.getElementById('proc');
			const pctx = proc.getContext('2d', { willReadFrequently: true });
			const PW = 96, PH = 96;
			proc.width = PW;
			proc.height = PH;
			const DIFF_THRESHOLD = 22;
			const MIN_MOVED_PIXELS = PW * PH * 0.004;
			let previousGray = null;
			let targetX = 50, targetY = 50; // 動き検知の位置（%）

			const detectMotion = () => {
				if (video.readyState < 2 || video.videoWidth === 0) return false;
				pctx.drawImage(video, 0, 0, PW, PH);
				const frame = pctx.getImageData(0, 0, PW, PH).data;
				if (!previousGray) {
					previousGray = new Float32Array(PW * PH);
					for (let i = 0, p = 0; i < frame.length; i += 4, p++) {
						previousGray[p] = 0.299 * frame[i] + 0.587 * frame[i + 1] + 0.114 * frame[i + 2];
					}
					return false;
				}
				let sumX = 0, sumY = 0, count = 0;
				for (let y = 0; y < PH; y++) {
					for (let x = 0; x < PW; x++) {
						const p = y * PW + x;
						const i = p * 4;
						const gray = 0.299 * frame[i] + 0.587 * frame[i + 1] + 0.114 * frame[i + 2];
						const diff = Math.abs(gray - previousGray[p]);
						previousGray[p] = gray;
						if (diff > DIFF_THRESHOLD) { sumX += x; sumY += y; count++; }
					}
				}
				if (count < MIN_MOVED_PIXELS) return false;
				targetX = (1 - (sumX / count) / PW) * 100;
				targetY = ((sumY / count) / PH) * 100;
				return true;
			};

			// 動き検知モードの御幣の現在位置
			let curX = 0, curY = 0;

			// ====== 手のランドマーク（任意・読み込めたら使う） ======
			const smooth = [];
			for (let i = 0; i < 21; i++) smooth.push(new THREE.Vector3());
			let hasSmooth = false;
			const tmp = new THREE.Vector3();

			const updateHandAndWand = (landmarks) => {
				for (let i = 0; i < 21; i++) {
					landmarkToWorld(landmarks[i], tmp);
					if (hasSmooth) smooth[i].lerp(tmp, 0.5);
					else smooth[i].copy(tmp);
				}
				hasSmooth = true;
				for (let i = 0; i < 21; i++) joints[i].position.copy(smooth[i]);
				for (let i = 0; i < HAND_CONNECTIONS.length; i++) {
					const [a, b] = HAND_CONNECTIONS[i];
					orientBone(bones[i], smooth[a], smooth[b]);
				}
				const wrist = smooth[0], midMcp = smooth[9];
				wand.position.copy(tmp.copy(wrist).lerp(midMcp, 0.6));
				const handSize = wrist.distanceTo(midMcp);
				wand.scale.setScalar(THREE.MathUtils.clamp(handSize * 3.4, 0.45, 1.6));
				const angle = Math.atan2(midMcp.y - wrist.y, midMcp.x - wrist.x);
				wand.rotation.z = angle - Math.PI / 2;
				wand.rotation.x = THREE.MathUtils.clamp((midMcp.z - wrist.z) * 1.5, -0.6, 0.6);
				wand.rotation.y = Math.sin(performance.now() / 1000) * 0.15;
			};

			// 動き検知モード：御幣だけを動かす（ボーンなし）
			const updateWandByMotion = () => {
				const { wx, wy } = toWorld(targetX, targetY);
				const vx = wx - curX;
				curX += vx * 0.18;
				curY += (wy - curY) * 0.18;
				wand.position.set(curX, curY, 0);
				wand.scale.setScalar(0.62);
				const t = performance.now() / 1000;
				wand.rotation.y = Math.sin(t * 1.1) * 0.55;
				wand.rotation.z += (THREE.MathUtils.clamp(-vx * 0.7, -0.6, 0.6) - wand.rotation.z) * 0.15;
				wand.rotation.x += (0 - wand.rotation.x) * 0.1;
			};

			// ====== メインループ ======
			let running = false;
			let stream = null;
			let handLandmarker = null;
			let modelFailed = false;

			const loop = () => {
				try {
					if (!running) return;
					if (video.readyState < 2 || video.videoWidth === 0) {
						setCaption('カメラ映像を待っています');
						return;
					}

					let handActive = false;
					if (handLandmarker) {
						let results;
						try {
							results = handLandmarker.detectForVideo(video, performance.now());
						} catch (e) {
							console.error('detectForVideo failed', e);
						}
						const landmarks = results?.landmarks?.[0];
						if (landmarks) {
							updateHandAndWand(landmarks);
							handActive = true;
						}
					}

					if (handActive) {
						hand.visible = true;
						wand.visible = true;
						setCaption('祓い清め中…');
					} else {
						// 手が無い／モデル未読込 → 動き検知で御幣だけ動かす
						hand.visible = false;
						hasSmooth = false;
						const moved = detectMotion();
						updateWandByMotion();
						wand.visible = true;
						if (modelFailed) {
							setCaption(moved ? '祓い清め中…（手の表示なし）' : '手を動かしてください');
						} else if (handLandmarker) {
							setCaption('手をかざしてください');
						} else {
							setCaption(moved ? '祓い清め中…' : '手を動かしてください');
						}
					}
				} finally {
					renderer.render(scene, camera);
					requestAnimationFrame(loop);
				}
			};

			// ====== MediaPipe 読み込み（複数CDNフォールバック） ======
			const CDN_BASES = [
				'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22',
				'https://unpkg.com/@mediapipe/tasks-vision@0.10.22',
			];
			const loadVision = async () => {
				for (const base of CDN_BASES) {
					try {
						const mod = await import(`${base}/vision_bundle.mjs`);
						const fileset = await mod.FilesetResolver.forVisionTasks(`${base}/wasm`);
						console.log('Vision loaded from', base);
						return { HandLandmarker: mod.HandLandmarker, fileset };
					} catch (e) {
						console.warn(`Vision load failed from ${base}`, e);
					}
				}
				return null;
			};

			// 手のボーンは「読めたら追加で出す」。失敗しても御幣表示は続ける
			const initHandTracking = async () => {
				const vision = await loadVision();
				if (!vision) {
					modelFailed = true;
					console.warn('手のボーン表示は無効（モデル読み込み失敗）。御幣の動き検知のみで継続します。');
					return;
				}
				const { HandLandmarker, fileset } = vision;
				const makeLandmarker = (delegate) =>
					HandLandmarker.createFromOptions(fileset, {
						baseOptions: {
							modelAssetPath:
								'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
							delegate,
						},
						runningMode: 'VIDEO',
						numHands: NUM_HANDS,
						minHandDetectionConfidence: 0.5,
						minHandPresenceConfidence: 0.5,
						minTrackingConfidence: 0.5,
					});
				try {
					handLandmarker = await makeLandmarker('GPU');
				} catch (gpuError) {
					console.warn('GPU delegate failed, falling back to CPU.', gpuError);
					try {
						handLandmarker = await makeLandmarker('CPU');
					} catch (cpuError) {
						modelFailed = true;
						console.error('HandLandmarker 生成失敗。御幣の動き検知のみで継続します。', cpuError);
					}
				}
			};

			// ====== 起動 ======
			const start = async () => {
				setCaption('カメラを準備しています');
				stream = await navigator.mediaDevices.getUserMedia({
					video: { facingMode: 'user' },
					audio: false,
				});
				video.srcObject = stream;
				await video.play();

				running = true;
				previousGray = null;
				wand.visible = true;
				setCaption('手を動かしてください');
				requestAnimationFrame(loop);

				// 手のボーンは裏で読み込み（成功したら自動で有効化）
				initHandTracking();
			};

			start().catch((error) => {
				console.error(error);
				if (error && (error.name === 'NotAllowedError' || error.name === 'NotFoundError')) {
					setCaption('カメラの許可を確認してください');
				} else {
					setCaption('起動に失敗しました（コンソールを確認）');
				}
			});
		</script>
	</body>
</html>
